databaseChangeLog:
  - changeSet:
      id: 2021_06_25-1
      author: antonliauchuk
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: custom_user
      changes:
        - createTable:
            tableName: custom_user
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  startWith: 1
                  incrementBy: 1
                  constraints:
                    primaryKey: true
                    primaryKeyName: custom_user_pk
              - column:
                  constraints:
                    nullable: false
                  name: username
                  type: VARCHAR(100)
              - column:
                  constraints:
                    nullable: false
                  name: email
                  type: VARCHAR(100)
              - column:
                  constraints:
                    nullable: false
                  name: password
                  type: VARCHAR(100)
              - column:
                  constraints:
                    nullable: false
                  name: role
                  type: VARCHAR(100)
  - changeSet:
      id: 2026_07_31-1
      author: devin
      preConditions:
        onFail: MARK_RAN
        not:
          columnExists:
            tableName: custom_user
            columnName: uuid
      changes:
        - addColumn:
            tableName: custom_user
            columns:
              - column:
                  name: uuid
                  type: uuid
        - update:
            tableName: custom_user
            columns:
              - column:
                  name: uuid
                  valueComputed: RANDOM_UUID()
            where: uuid IS NULL
        - addNotNullConstraint:
            tableName: custom_user
            columnName: uuid
            columnDataType: uuid
  # Data reconciliation across module tables: the course-enrollments changelog runs
  # before this one, so its student.uuid backfill cannot see custom_user.uuid yet.
  # This changeset copies the user's uuid into matching student rows so pre-existing
  # students share the user's stable cross-module identity.
  - changeSet:
      id: 2026_07_31-2
      author: devin
      preConditions:
        onFail: MARK_RAN
        and:
          - tableExists:
              tableName: student
          - columnExists:
              tableName: student
              columnName: uuid
      changes:
        - sql:
            sql: >-
              UPDATE student s
              SET uuid = (SELECT u.uuid FROM custom_user u WHERE u.username = s.username)
              WHERE EXISTS (SELECT 1 FROM custom_user u WHERE u.username = s.username)
