spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yml
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Strangler-fig migration of the `courses` module to the Python `courses-py` service (see courses-py/README.md).
# Bridge in-JVM integration events to/from RabbitMQ (spring.rabbitmq.* configures the connection).
courses.event-bridge.enabled=false
# Keep handling inbound integration events in the Java `courses` module; set to false once `courses-py` consumes them
# from the broker, otherwise both implementations would apply the same event to the shared tables.
courses.in-process-handlers.enabled=true
