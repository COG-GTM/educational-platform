[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-reviews"
version = "0.0.1"
description = "Course Reviews bounded context of the educational platform, as a standalone Python service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.5,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["course_reviews*"]

[tool.pytest.ini_options]
testpaths = ["course_reviews/tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Tests deliberately build invalid commands (model_construct) and use autospec'd mocks.
module = "course_reviews.tests.*"
disable_error_code = ["arg-type", "no-any-return"]
