databaseChangeLog:
  - changeSet:
      id: 2021_06_13-1
      author: antonliauchuk
      preConditions:
        onFail: MARK_RAN
        not:
          tableExists:
            tableName: course_proposal
      changes:
        - createTable:
            tableName: course_proposal
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  startWith: 1
                  incrementBy: 1
                  constraints:
                    primaryKey: true
                    primaryKeyName: course_proposal_pk
              - column:
                  constraints:
                    nullable: false
                  name: uuid
                  type: uuid
              - column:
                  constraints:
                    nullable: false
                  name: status
                  type: VARCHAR(14)
  - changeSet:
      id: add-version-column-to-course_proposal
      author: devin
      changes:
        - addColumn:
            tableName: course_proposal
            columns:
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
